<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#c9f1f8">
  <title>Notice · Lyceum Archive</title>

  <style>

@font-face{
  font-family:"GmarketSans";
  src:url("../assets/GmarketSansTTFLight.ttf") format("truetype");
  font-weight:300;
  font-style:normal;
  font-display:swap;
}

:root{
  --bg:#ffffff;
  --ink:#50585b;
  --muted:#9eb3b8;
  --line:#dce9ec;
  --sky:#c9f1f8;
  --sky-strong:#9fdfec;
  --sky-soft:#edfafd;
  --card:#ffffff;
  --notice:#dbe9ed;
  --notice-top:#c5eef6;
  --notice-text:#6f8d94;
  --shadow:0 10px 28px rgba(66,87,94,.08);
  --radius:24px;
  --max:1120px;
}

*{box-sizing:border-box}

html{
  min-height:100%;
  background:var(--bg);
}

body{
  margin:0;
  min-height:100vh;
  font-family:"GmarketSans","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-weight:300;
  color:var(--ink);
  background:
    radial-gradient(circle at 85% 7%, rgba(201,241,248,.22), transparent 26%),
    var(--bg);
}

img{
  display:block;
  max-width:100%;
}

a{
  color:inherit;
  text-decoration:none;
}

.topline{
  position:fixed;
  inset:0 0 auto 0;
  height:8px;
  background:var(--sky);
  z-index:100;
}

/* ===== NAV ===== */
.icon-nav{
  position:fixed;
  z-index:90;
  right:22px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
}

.icon-nav a{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  box-shadow:0 8px 20px rgba(61,80,86,.08);
  color:#9bb8be;
  backdrop-filter:blur(12px);
  transition:.2s ease;
  position:relative;
}

.icon-nav a:hover{
  transform:translateX(-3px);
  color:#6897a1;
  border-color:#c8e5eb;
}

.icon-nav a.active{
  background:var(--sky);
  color:#5d8790;
  border-color:var(--sky);
}

.icon-nav svg{
  width:20px !important;
  height:20px !important;
  max-width:20px !important;
  max-height:20px !important;
  stroke:currentColor;
  fill:none;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon-nav .tip{
  position:absolute;
  right:54px;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transform:translateX(4px);
  transition:.2s ease;
  background:#fff;
  color:#8aa1a7;
  border:1px solid #e0eaec;
  border-radius:999px;
  padding:7px 10px;
  font-size:10px;
  box-shadow:0 6px 18px rgba(70,90,96,.08);
}

.icon-nav a:hover .tip{
  opacity:1;
  transform:translateX(0);
}

/* ===== COMMON ===== */
.page-shell{
  width:min(var(--max), calc(100% - 112px));
  margin:0 auto;
  min-height:100vh;
  padding:68px 0 58px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.big-title{
  margin:0 0 28px;
  font-size:clamp(48px,7vw,92px);
  line-height:.95;
  letter-spacing:-.05em;
  font-weight:300;
  color:#596164;
}

.corner-credit{
  position:fixed;
  left:20px;
  bottom:16px;
  color:#c0d0d4;
  font-size:10px;
  letter-spacing:.06em;
}

/* ===== ACCOUNT ===== */
.account-wrap{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:48px;
  align-items:center;
}

.account-avatar{
  width:clamp(160px,21vw,250px);
  aspect-ratio:1;
  border-radius:50%;
  padding:8px;
  background:var(--sky);
  box-shadow:var(--shadow);
  overflow:hidden;
  position:relative;
}

.account-avatar::before{
  content:"곰";
  position:absolute;
  inset:8px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:linear-gradient(145deg,#f8feff,#e4f8fb);
  color:#b5d9df;
  font-size:44px;
}

.account-avatar img{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.account-name{
  margin:0;
  font-size:clamp(58px,9vw,126px);
  line-height:.92;
  letter-spacing:-.06em;
  font-weight:300;
  color:#50585b;
}

.account-id{
  margin-top:16px;
  font-size:clamp(24px,4vw,48px);
  color:#b0c9cf;
  text-decoration:underline;
  text-decoration-thickness:1px;
  text-underline-offset:8px;
}

.account-tags{
  margin-top:32px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.tag{
  border:1px solid #e0e8ea;
  background:rgba(255,255,255,.9);
  border-radius:999px;
  padding:12px 18px;
  color:#718084;
  font-size:12px;
  box-shadow:0 5px 16px rgba(63,84,91,.06);
}

/* ===== QUOTES ===== */
.quote-stack{
  display:grid;
  gap:14px;
}

.quote-card{
  padding:24px 28px;
  background:rgba(255,255,255,.9);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 8px 24px rgba(63,88,95,.06);
  position:relative;
  overflow:hidden;
}

.quote-who{
  font-size:11px;
  letter-spacing:.15em;
  color:#a1bdc3;
  margin-bottom:12px;
}

.quote-text{
  margin:0;
  font-size:clamp(18px,2.05vw,26px);
  line-height:1.72;
  letter-spacing:-.025em;
  color:#596568;
  word-break:keep-all;
}

.quote-source{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid #e3eef0;
  color:#8ca2a7;
  font-size:12px;
  line-height:1.7;
}

.quote-source em{
  font-style:normal;
  color:#6d8186;
}

.quote-original{
  margin-top:5px;
  color:#b0c0c3;
  font-size:11px;
  line-height:1.55;
}

/* ===== CHARACTERS ===== */
.people{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.person{
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  box-shadow:0 8px 24px rgba(63,88,95,.06);
}

.person-image{
  width:100%;
  aspect-ratio:4/3;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(135deg,#eefcff,#dceff3);
}

.person-image::before{
  content:attr(data-letter);
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#bad8de;
  font-size:68px;
}

.person-image img{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  object-fit:cover;
}

.person-name{
  margin:18px 0 0;
  font-size:22px;
  font-weight:300;
  color:#566165;
}

.person-latin{
  display:block;
  margin-top:5px;
  color:#a1b5ba;
  font-size:11px;
}

.person-copy{
  margin:16px 0 0;
  color:#738185;
  font-size:13px;
  line-height:1.86;
  word-break:keep-all;
}

.keywords{
  margin-top:16px;
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.keywords span{
  padding:7px 9px;
  font-size:10px;
  border-radius:999px;
  background:#ebfbfe;
  color:#74a2ab;
}

/* ===== NOTICE ===== */
.notice-shell{
  width:min(920px, calc(100% - 112px));
  margin:0 auto;
  min-height:100vh;
  padding:54px 0 54px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.profile-panel{
  border-radius:42px;
  overflow:hidden;
  background:var(--notice);
  height:270px;
  min-height:0;
  position:relative;
  box-shadow:var(--shadow);
}

.profile-panel-top{
  height:104px;
  background:var(--notice-top);
}

.notice-avatar{
  position:absolute;
  top:48px;
  left:56px;
  width:116px;
  height:116px;
  border-radius:50%;
  padding:6px;
  background:rgba(248,252,253,.92);
  box-shadow:0 8px 18px rgba(0,0,0,.07);
}

.notice-avatar::before{
  content:"곰";
  position:absolute;
  inset:6px;
  display:grid;
  place-items:center;
  border-radius:50%;
  color:#95adb3;
  font-size:28px;
  background:#e4f1f4;
}

.notice-avatar img{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.profile-mood{
  position:absolute;
  left:56px;
  right:40px;
  bottom:34px;
  color:#76939a;
  font-size:25px;
  line-height:1.35;
  letter-spacing:-.03em;
}

.profile-mood .nickname{
  display:block;
  padding-top:2px;
}

.notice-card{
  margin-top:20px;
  padding:48px 54px 44px;
  border-radius:42px;
  background:var(--notice);
  box-shadow:var(--shadow);
}

.notice-text{
  color:var(--notice-text);
  font-size:clamp(17px,2.15vw,25px);
  line-height:1.9;
  letter-spacing:-.03em;
  word-break:keep-all;
}

.notice-text p{
  margin:0 0 18px;
}

.notice-text p:last-child{
  margin-bottom:0;
}

/* ===== RESPONSIVE ===== */
@media (max-width:860px){
  .page-shell,
  .notice-shell{
    width:min(100% - 40px, 760px);
  }

  .account-wrap{
    grid-template-columns:1fr;
    justify-items:center;
    text-align:center;
  }

  .account-tags{
    justify-content:center;
  }

  .people{
    grid-template-columns:1fr;
  }

  .icon-nav{
    top:auto;
    bottom:16px;
    right:50%;
    transform:translateX(50%);
    flex-direction:row;
    padding:7px;
    background:rgba(255,255,255,.84);
    border:1px solid #e1eaec;
    border-radius:999px;
    backdrop-filter:blur(14px);
  }

  .icon-nav .tip{
    display:none;
  }

  .corner-credit{
    display:none;
  }

  body{
    padding-bottom:72px;
  }

  .profile-panel{
    height:238px;
    border-radius:34px;
  }

  .profile-panel-top{
    height:92px;
  }

  .notice-avatar{
    top:42px;
    left:34px;
    width:100px;
    height:100px;
  }

  .profile-mood{
    left:34px;
    right:30px;
    bottom:28px;
    font-size:22px;
  }

  .notice-card{
    margin-top:18px;
    padding:40px 36px 38px;
    border-radius:34px;
  }
}

@media (max-width:520px){
  .page-shell,
  .notice-shell{
    width:min(100% - 24px, 480px);
  }

  .account-avatar{
    width:145px;
  }

  .tag{
    padding:10px 13px;
  }

  .quote-card{
    padding:22px 20px;
  }

  .profile-panel{
    height:214px;
    border-radius:28px;
  }

  .profile-panel-top{
    height:82px;
  }

  .notice-avatar{
    top:37px;
    left:26px;
    width:90px;
    height:90px;
  }

  .profile-mood{
    left:26px;
    right:24px;
    bottom:24px;
    font-size:20px;
  }

  .notice-card{
    margin-top:15px;
    padding:34px 28px 32px;
    border-radius:28px;
  }
}

  </style>
</head>


<body>

<div class="topline"></div>

<nav class="icon-nav" aria-label="페이지 이동">
  <a href="../index.html">
    <span class="tip">ACCOUNT</span>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M3.5 10.5 12 3l8.5 7.5"></path>

      <path d="M9.5 21v-6h5v6"></path>
    </svg>
  </a>

  <a href="../quotes/index.html">
    <span class="tip">QUOTES</span>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M8.5 6H5.8A2.8 2.8 0 0 0 3 8.8V12h5.5v6H3"></path>
      <path d="M20.5 6h-2.7A2.8 2.8 0 0 0 15 8.8V12h5.5v6H15"></path>
    </svg>
  </a>

  <a href="../notice/index.html" class="active">
    <span class="tip">NOTICE</span>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">

      <path d="M8.3 10.8h7.4M8.3 13.8h4.8"></path>
    </svg>
  </a>

  <a href="../characters/index.html">
    <span class="tip">PEOPLE</span>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <circle cx="9" cy="8" r="3.2"></circle>
      <path d="M3.5 19c.7-3.4 2.5-5.1 5.5-5.1S13.8 15.6 14.5 19"></path>
      <circle cx="17" cy="9" r="2.4"></circle>
      <path d="M15.5 14.5c2.6-.2 4.2 1.1 5 3.9"></path>
    </svg>
  </a>
</nav>


<main class="notice-shell">
  <section class="profile-panel">
    <div class="profile-panel-top"></div>

    <div class="notice-avatar">
      <img src="../assets/profile.jpg" alt="프로필" onerror="this.style.display='none'">
    </div>

    <div class="profile-mood">
      <span class="nickname">곰돌</span>
    </div>
  </section>

  <section class="notice-card">
    <div class="notice-text">
      <p>
        ‘순정철학논고’ 니체 위주 드림계입니다.
        백업 및 썰, 연성 업로드 위주로 굴러갑니다.
      </p>

      <p>
        극온리로, 니체 드림은 보이는 족족 뮤트합니다.
        악의 없습니다.

      <p>우익 장르는 받지 않습니다.</p>

      <p>
        이 외에도 보지 못하는 드림이 있으며,
        발견하는 경우 조용히 뮤트합니다.
      </p>
    </div>
  </section>
</main>
